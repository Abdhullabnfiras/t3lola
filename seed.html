<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بذر بيانات تعلولة</title>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(196, 154, 64, 0.18), transparent 60%), #050403;
      font-family: 'Readex Pro', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(19, 16, 12, 0.95);
      border: 1px solid rgba(196, 154, 64, 0.25);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }
    h1 { font-family: 'Changa', sans-serif; margin: 0 0 8px; }
    p { color: #8c8070; font-size: 14px; line-height: 1.7; margin: 0 0 24px; }
    .status { min-height: 40px; font-size: 14px; margin: 16px 0; padding: 12px; border-radius: 14px; }
    .status.loading { background: rgba(196, 154, 64, 0.1); color: #f4dfb0; }
    .status.done { background: rgba(61, 213, 152, 0.1); color: #3dd598; }
    .status.error { background: rgba(248, 113, 113, 0.1); color: #f87171; }
    button {
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      padding: 14px 24px;
      font-size: 15px;
      transition: transform .2s;
      width: 100%;
    }
    button:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #f5d79c, #c49a40);
      color: #2b1a05;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
      margin-top: 10px;
    }
    .counts { display: flex; justify-content: center; gap: 24px; margin: 16px 0; }
    .count { text-align: center; }
    .count-num { font-size: 28px; font-weight: 800; color: #f4dfb0; }
    .count-lbl { font-size: 12px; color: #8c8070; }
    a { color: #c49a40; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌴 تعلولة</h1>
    <p>هذه الصفحة ترفع التصنيفات والأطباق الافتراضية إلى Firebase.<br>اضغط الزر لبدء البذر.</p>

    <div class="counts">
      <div class="count">
        <div class="count-num" id="catCount">0</div>
        <div class="count-lbl">تصنيف</div>
      </div>
      <div class="count">
        <div class="count-num" id="itemCount">0</div>
        <div class="count-lbl">طبق</div>
      </div>
    </div>

    <div class="status" id="statusMsg">بانتظارك...</div>

    <button class="btn-primary" id="seedBtn">🚀 رفع القائمة إلى Firebase</button>

    <div style="margin-top:20px;display:flex;flex-direction:column;gap:8px">
      <a href="admin.html" target="_blank">🗂️ فتح لوحة الإدارة</a>
      <a href="index.html" target="_blank">👁️ فتح القائمة الرئيسية</a>
    </div>
  </div>

  <script type="module">
    import { database } from './firebase-config.js';
    import { MENU_SEED } from './menu-seed.js';
    import {
      ref,
      set,
      get
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    document.getElementById('catCount').textContent = MENU_SEED.categories.length;
    document.getElementById('itemCount').textContent = MENU_SEED.items.length;

    const seedBtn = document.getElementById('seedBtn');
    const statusMsg = document.getElementById('statusMsg');

    seedBtn.addEventListener('click', async () => {
      seedBtn.disabled = true;
      seedBtn.textContent = 'جارٍ الرفع...';
      statusMsg.className = 'status loading';
      statusMsg.textContent = '⏳ يتم رفع البيانات إلى Firebase...';

      try {
        const rootRef = ref(database, 'taaloola_menu');

        const catsObj = {};
        MENU_SEED.categories.forEach((cat, idx) => {
          catsObj[cat.id] = { id: cat.id, name: cat.name, order: cat.order ?? idx };
        });

        const itemsObj = {};
        MENU_SEED.items.forEach((item, idx) => {
          itemsObj[item.id] = { ...item, order: item.order ?? idx };
        });

        await set(rootRef, {
          categories: catsObj,
          items: itemsObj,
          settings: { lastReset: Date.now(), lastResetBy: 'seed_page' },
          orders: {}
        });

        const snap = await get(rootRef);
        if (snap.exists()) {
          statusMsg.className = 'status done';
          statusMsg.textContent = `✅ تم رفع ${MENU_SEED.categories.length} تصنيف و ${MENU_SEED.items.length} طبق بنجاح!`;
        } else {
          throw new Error('الكتابة تمت لكن القراءة فشلت');
        }
      } catch (err) {
        statusMsg.className = 'status error';
        statusMsg.textContent = '❌ خطأ: ' + err.message;
      } finally {
        seedBtn.disabled = false;
        seedBtn.textContent = '🚀 رفع القائمة إلى Firebase';
      }
    });
  </script>
</body>
</html>
